name: Check Upstream CachyOS Kernel Updates

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch upstream version & check against latest release
        id: version_check
        run: |
          set -euo pipefail

          # Fetch upstream PKGBUILD content
          PKGBUILD_URL="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/PKGBUILD"
          PKGBUILD_CONTENT=$(curl -sSL "$PKGBUILD_URL")

          # Extract pkgver and pkgrel
          PKGVER=$(echo "$PKGBUILD_CONTENT" | grep -E '^pkgver=' | cut -d'=' -f2 | tr -d "'\"")
          PKGREL=$(echo "$PKGBUILD_CONTENT" | grep -E '^pkgrel=' | cut -d'=' -f2 | tr -d "'\"")
          UPSTREAM_TAG="${PKGVER}-${PKGREL}"

          echo "Upstream version: ${UPSTREAM_TAG}"

          # Fetch latest release title from this repo (release title format: "CachyOS Kernel <pkgver>-<pkgrel> (znver3)")
          RELEASE_TITLE=$(curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" | jq -r '.name // empty')

          echo "Latest release title: ${RELEASE_TITLE}"

          if [[ "$RELEASE_TITLE" != *"$UPSTREAM_TAG"* ]]; then
            echo "New version detected (${UPSTREAM_TAG} not in release title). Triggering build..."
            echo "NEW_VERSION=true" >> $GITHUB_OUTPUT
            echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> $GITHUB_OUTPUT
          else
            echo "Already up to date (${UPSTREAM_TAG})."
            echo "NEW_VERSION=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Kernel Build Workflow
        if: steps.version_check.outputs.NEW_VERSION == 'true'
        run: |
          echo "Triggering build-kernel.yml..."
          gh workflow run build-kernel.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
