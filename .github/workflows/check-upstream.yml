name: Check Upstream CachyOS Kernel Updates

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch upstream version & check against latest release
        id: version_check
        run: |
          set -euo pipefail

          # Fetch upstream PKGBUILD content
          PKGBUILD_URL="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/PKGBUILD"
          PKGBUILD_CONTENT=$(curl -sSL "$PKGBUILD_URL")

          # Extract version variables from PKGBUILD by evaluating in bash subshell
          UPSTREAM_TAG=$(bash -c "$PKGBUILD_CONTENT; echo \${pkgver}-\${pkgrel}")

          echo "Upstream version: ${UPSTREAM_TAG}"

          # Fetch latest release from this repo
          LATEST_RELEASE=$(curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")

          RELEASE_TITLE=$(echo "$LATEST_RELEASE" | jq -r '.name // empty')
          RELEASE_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // empty')

          echo "Latest release title: ${RELEASE_TITLE}"
          echo "Latest release tag: ${RELEASE_TAG}"

          if [[ "$RELEASE_TITLE" != *"$UPSTREAM_TAG"* ]] && [[ "$RELEASE_TAG" != *"$UPSTREAM_TAG"* ]]; then
            echo "New version detected (${UPSTREAM_TAG} not in latest release). Triggering build..."
            echo "NEW_VERSION=true" >> $GITHUB_OUTPUT
            echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> $GITHUB_OUTPUT
          else
            echo "Already up to date (${UPSTREAM_TAG})."
            echo "NEW_VERSION=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Kernel Build Workflow
        if: steps.version_check.outputs.NEW_VERSION == 'true'
        run: |
          echo "Triggering build-kernel.yml..."
          gh workflow run build-kernel.yml -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
